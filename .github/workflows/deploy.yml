name: Deploy

# Construit l'image Docker (amd64 + arm64), la publie sur ghcr.io, puis la déploie sur la VM.
# Secrets requis   : VM_HOST, VM_USER, VM_SSH_KEY, VM_KNOWN_HOSTS
# Variables requises : SITE_URL (https://votre-domaine) ; optionnelles : NEXT_PUBLIC_* (voir docs/deploy-vm.md)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_LEGAL_NAME=${{ vars.NEXT_PUBLIC_LEGAL_NAME }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
            NEXT_PUBLIC_HOST_NAME=${{ vars.NEXT_PUBLIC_HOST_NAME }}
            NEXT_PUBLIC_HOST_ADDRESS=${{ vars.NEXT_PUBLIC_HOST_ADDRESS }}
            NEXT_PUBLIC_HOST_URL=${{ vars.NEXT_PUBLIC_HOST_URL }}
            NEXT_PUBLIC_CF_BEACON_TOKEN=${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH (clé d'hôte épinglée, pas de confiance au premier contact)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copier docker-compose.yml et Caddyfile
        run: |
          OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          ssh $OPTS "$VM_USER@$VM_HOST" 'mkdir -p ~/jambo'
          scp $OPTS docker-compose.yml Caddyfile "$VM_USER@$VM_HOST:~/jambo/"

      - name: Tirer la nouvelle image et redémarrer
        run: |
          OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          ssh $OPTS "$VM_USER@$VM_HOST" \
            "cd ~/jambo && export IMAGE_TAG='$IMAGE_TAG' && docker compose pull app && docker compose up -d && docker image prune -f"

      - name: Vérifier la santé du site
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$SITE_URL/api/health" | grep -q '"status":"ok"'; then
              echo "Site en bonne santé"; exit 0
            fi
            echo "Tentative $i/12 : pas encore prêt"; sleep 10
          done
          echo "Le site ne répond pas correctement après le déploiement" >&2
          exit 1
