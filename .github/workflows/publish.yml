# .github/workflows/publish.yml
name: Scheduled Publish

on:
  schedule:
    # lun/mer/ven à 9h Paris : deux déclenchements (07:15 UTC en été, 08:15 UTC en hiver).
    # L'API ne publie qu'une entrée échue et refuse une 2e publication dans les 6 h.
    - cron: '15 7 * * 1,3,5'
    - cron: '15 8 * * 1,3,5'
  workflow_dispatch:            # permet de déclencher manuellement depuis GitHub

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish webhook
        run: |
          curl -f -X POST "${{ secrets.SITE_URL }}/api/schedule/publish" \
            -H "Authorization: Bearer ${{ secrets.PUBLISH_SECRET }}" \
            -H "Content-Type: application/json"
